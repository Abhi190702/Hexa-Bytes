name: Keep API warm

# Free Render services sleep after ~15 min idle (cold start ~30-50s). Pinging the health
# endpoint every ~10 min keeps it awake during the day. (GitHub may delay scheduled runs,
# and disables schedules after 60 days of repo inactivity — fine for an active project.)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: curl -fsS --max-time 60 https://evocomb-api.onrender.com/api/v1/health || true
