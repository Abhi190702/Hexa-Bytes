# Dev overrides — applied automatically by `docker compose up`.
# Exposes service ports directly and runs the API with hot reload + bind-mounted source.
# The web app is best run with `pnpm --filter @platform/web dev` locally for fastest HMR.

services:
  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  mqtt:
    ports:
      - "1883:1883"

  api:
    environment:
      API_ENV: development
    command:
      ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./apps/api/src:/app/src
    ports:
      - "8000:8000"
